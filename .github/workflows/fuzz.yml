name: Fuzz

# Two tiers: a fast smoke pass on every push/PR (build + a short run, so a broken
# target or a fresh panic is caught in CI), and a deep, time-boxed run on a
# schedule / on demand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Fuzz smoke (${{ matrix.target }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_parse_entries]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo install cargo-fuzz --locked
      - name: Seed corpus from the committed real journal
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cp tests/data/*.journal "fuzz/corpus/${{ matrix.target }}/" 2>/dev/null || true
      - name: Fuzz ${{ matrix.target }} (45s smoke)
        run: cargo +nightly fuzz run "${{ matrix.target }}" fuzz/corpus/${{ matrix.target }} -- -max_total_time=45 -rss_limit_mb=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  deep:
    name: Fuzz deep (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_parse_entries]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - run: cargo install cargo-fuzz --locked
      - name: Seed corpus from the committed real journal
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cp tests/data/*.journal "fuzz/corpus/${{ matrix.target }}/" 2>/dev/null || true
      - name: Fuzz ${{ matrix.target }} (10 min)
        run: cargo +nightly fuzz run "${{ matrix.target }}" fuzz/corpus/${{ matrix.target }} -- -max_total_time=600 -rss_limit_mb=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
